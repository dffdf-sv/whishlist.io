<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Whishlist.io</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"><script>document.documentElement.dataset.theme=localStorage.getItem("whishlist-theme")||"light";</script><link rel="stylesheet" href="/style.css"><style id="corner-theme-toggle">
.theme-toggle{position:fixed!important;left:24px!important;bottom:24px!important;top:auto!important;right:auto!important;z-index:9999;display:inline-flex;align-items:center;justify-content:center;gap:0;min-width:0!important;width:48px;height:48px;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;color:var(--text)!important;backdrop-filter:none!important;transition:transform .2s,color .2s}
.theme-toggle:before,.theme-toggle:after{content:none!important;display:none!important}
.theme-toggle:hover{transform:translateY(-2px) scale(1.06);box-shadow:none!important;background:transparent!important}
.theme-toggle .theme-icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:27px;line-height:1;color:var(--text)}
.theme-toggle .theme-label{display:none!important}
@media(max-width:600px){.theme-toggle{left:14px!important;bottom:14px!important;width:44px;height:44px}}
</style></head><body><main class="shell center"><div class="top"><a class="brand" href="/">♥ whishlist.io</a><button id="theme" class="ghost theme-toggle"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span></button></div><section class="hero-card login-card"><div class="eyebrow" id="modeLabel">OWNER LOGIN</div><h1 id="heading">Welcome back.</h1><p id="subheading">Log in to see all your wishlists in one place.</p><form id="accountForm"><label>Username<input id="username" autocomplete="username" placeholder="Your username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Your password" minlength="8" required></label><label id="dobLabel" hidden>Date of birth (optional)<input id="dob" type="date"></label><label class="check-row"><input id="remember" type="checkbox" checked> <span>Remember me on this device</span></label><button type="submit" id="submit">Log in →</button></form><p id="error" class="error"></p><button id="switch" class="button ghost full">Create a new account</button></section><section id="dashboard" class="dashboard" hidden></section></main><script>
const themeBtn=document.querySelector("#theme");function applyTheme(){const dark=localStorage.getItem("whishlist-theme")==="dark";document.documentElement.dataset.theme=dark?"dark":"light";document.body.classList.toggle("dark",dark);themeBtn.innerHTML=dark?'<span class="theme-icon" aria-hidden="true">☼</span><span class="theme-label">Light</span>':'<span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span>'}themeBtn.onclick=()=>{localStorage.setItem("whishlist-theme",localStorage.getItem("whishlist-theme")==="dark"?"light":"dark");applyTheme()};applyTheme();
const form=document.querySelector("#accountForm"),dashboard=document.querySelector("#dashboard"),error=document.querySelector("#error"),switchBtn=document.querySelector("#switch"),dobLabel=document.querySelector("#dobLabel");let signup=false;
switchBtn.onclick=()=>{signup=!signup;document.querySelector("#modeLabel").textContent=signup?"CREATE ACCOUNT":"OWNER LOGIN";document.querySelector("#heading").textContent=signup?"Create your account.":"Welcome back.";document.querySelector("#subheading").textContent=signup?"Your wishlists will be saved to this account.":"Log in to see all your wishlists in one place.";document.querySelector("#submit").textContent=signup?"Create account →":"Log in →";switchBtn.textContent=signup?"I already have an account":"Create a new account";dobLabel.hidden=!signup;document.querySelector("#password").minLength=signup?8:1};
form.onsubmit=async e=>{e.preventDefault();error.textContent="";const button=document.querySelector("#submit");button.disabled=true;button.textContent=signup?"Creating…":"Checking…";try{const r=await fetch(signup?"/api/accounts":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value.trim(),password:document.querySelector("#password").value,dob:document.querySelector("#dob").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");if(document.querySelector("#remember").checked)localStorage.setItem("whishlist-session",d.token);else sessionStorage.setItem("whishlist-session",d.token);localStorage.setItem("whishlist-username",d.username);d.lists.forEach(x=>localStorage.setItem("whishlist-manage-"+x.id,x.manageUrl));if(location.search.includes("return=")){location.href=new URLSearchParams(location.search).get("return")||"/";return}showDashboard(d)}catch(e){error.textContent=e.message}finally{button.disabled=false;button.textContent=signup?"Create account →":"Log in →"}};
async function showDashboard(d){form.closest(".hero-card").hidden=true;dashboard.hidden=false;dashboard.innerHTML=`<div class="dashboard-head"><div><div class="eyebrow">YOUR WISHLISTS</div><h2>Welcome, ${esc(d.username)}.</h2><p>Your new wishlists will be added here automatically.</p></div><div class="actions"><a class="button" href="/">+ New wishlist</a><button class="button ghost" id="logout">Log out</button></div></div><div class="wishlist-dashboard">${d.lists.length?d.lists.map(x=>`<article class="wishlist-card"><div class="wishlist-icon">♥</div><div class="wishlist-card-body"><h3>${esc(x.title)}</h3><p>${esc(x.description||"No description yet.")}</p><div class="wishlist-meta">${x.itemCount} ${x.itemCount===1?"wish":"wishes"}</div><div class="actions"><a class="button" href="${x.manageUrl}">Edit wishlist</a><a class="button ghost" href="${x.shareUrl}">View list</a></div></div></article>`).join(""):`<div class="empty">You don't have any wishlists yet. <a href="/">Create your first one →</a></div>`}</div>`;document.querySelector("#logout").onclick=logout}
function logout(){const token=localStorage.getItem("whishlist-session")||sessionStorage.getItem("whishlist-session");fetch("/api/logout",{method:"POST",headers:{Authorization:"Bearer "+token}}).finally(()=>{localStorage.removeItem("whishlist-session");sessionStorage.removeItem("whishlist-session");localStorage.removeItem("whishlist-username");location.href="/login"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
(async()=>{const token=localStorage.getItem("whishlist-session")||sessionStorage.getItem("whishlist-session");if(!token)return;const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+token}});if(r.ok){const d=await r.json();showDashboard(d)}else{localStorage.removeItem("whishlist-session");sessionStorage.removeItem("whishlist-session")}})();
</script></body></html>
