<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Whishlist.io</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"><script>document.documentElement.dataset.theme=localStorage.getItem("whishlist-theme")||"light";</script><link rel="stylesheet" href="/style.css"></head><body><main class="shell center"><div class="top"><a class="brand" href="/">♥ whishlist.io</a><button id="theme" class="ghost theme-toggle">🌙 Dark</button></div><section class="hero-card login-card"><div class="eyebrow">OWNER LOGIN</div><h1>Welcome back.</h1><p>Log in to see all your wishlists in one place.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" placeholder="Your username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></label><button type="submit" id="login">Log in →</button></form><p id="error" class="error"></p><small>If you created a wishlist without a username and password, use its private management link instead.</small></section><section id="dashboard" class="dashboard" hidden></section></main><script>
const themeBtn=document.querySelector("#theme");
function applyTheme(){const dark=localStorage.getItem("whishlist-theme")==="dark";document.documentElement.dataset.theme=dark?"dark":"light";document.body.classList.toggle("dark",dark);themeBtn.textContent=dark?"☀️ Light":"🌙 Dark"}
themeBtn.onclick=()=>{localStorage.setItem("whishlist-theme",localStorage.getItem("whishlist-theme")==="dark"?"light":"dark");applyTheme()};applyTheme();
const form=document.querySelector("#loginForm"), dashboard=document.querySelector("#dashboard"), error=document.querySelector("#error");
form.onsubmit=async e=>{e.preventDefault();error.textContent="";const button=document.querySelector("#login");button.disabled=true;button.textContent="Checking…";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value.trim(),password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");d.lists.forEach(x=>localStorage.setItem("whishlist-manage-"+x.id,x.manageUrl));form.closest(".hero-card").hidden=true;dashboard.hidden=false;dashboard.innerHTML=`<div class="dashboard-head"><div><div class="eyebrow">YOUR WISHLISTS</div><h2>Welcome, ${esc(d.username)}.</h2><p>Choose a wishlist to edit or share.</p></div><a class="button ghost" href="/">+ New wishlist</a></div><div class="wishlist-dashboard">${d.lists.map(x=>`<article class="wishlist-card"><div class="wishlist-icon">♥</div><div class="wishlist-card-body"><h3>${esc(x.title)}</h3><p>${esc(x.description||"No description yet.")}</p><div class="wishlist-meta">${x.itemCount} ${x.itemCount===1?"wish":"wishes"}</div><div class="actions"><a class="button" href="${x.manageUrl}">Edit wishlist</a><a class="button ghost" href="${x.shareUrl}">View list</a></div></div></article>`).join("")}</div>`; }catch(e){error.textContent=e.message}finally{button.disabled=false;button.textContent="Log in →"}};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
</script></body></html>
