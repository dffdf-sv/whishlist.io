<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Whishlist.io</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head><body><main class="shell center"><div class="top"><a class="brand" href="/">♥ whishlist.io</a><button id="theme" class="ghost theme-toggle">🌙 Dark</button></div><section class="hero-card login-card"><div class="eyebrow">OWNER LOGIN</div><h1>Welcome back.</h1><p>Log in to open your saved wishlist editor.</p><label>Username<input id="username" autocomplete="username" placeholder="Username"></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Password"></label><button id="login">Log in →</button><p id="error" class="error"></p><small>If you created a wishlist without a username and password, use its private management link instead.</small></section></main><script>const t=document.querySelector("#theme");function theme(){const d=localStorage.getItem("whishlist-theme")==="dark";document.body.classList.toggle("dark",d);t.textContent=d?"☀️ Light":"🌙 Dark"}t.onclick=()=>{localStorage.setItem("whishlist-theme",localStorage.getItem("whishlist-theme")==="dark"?"light":"dark");theme()};theme();document.querySelector("#login").onclick=async()=>{const error=document.querySelector("#error");error.textContent="";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value.trim(),password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");localStorage.setItem("whishlist-manage-"+d.id,d.manageUrl);location.href=d.manageUrl}catch(e){error.textContent=e.message}};document.querySelector("#password").addEventListener("keydown",e=>{if(e.key==="Enter")document.querySelector("#login").click()});</script></body></html>
