<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><style id="corner-theme-toggle">
.theme-toggle{position:fixed!important;left:24px!important;bottom:24px!important;top:auto!important;right:auto!important;z-index:9999;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:116px;padding:13px 17px!important;border:1px solid color-mix(in srgb,var(--accent,#8b5cf6) 48%,transparent)!important;border-radius:16px!important;background:color-mix(in srgb,var(--card,#fff) 88%,transparent)!important;backdrop-filter:blur(14px);box-shadow:0 8px 28px #17102b22;font-weight:650;letter-spacing:.01em;transition:transform .2s,box-shadow .2s,border-color .2s}
.theme-toggle:before,.theme-toggle:after{content:"";position:absolute;left:50%;width:30px;height:1px;background:currentColor;opacity:.28;transform:translateX(-50%)}
.theme-toggle:before{top:-7px}.theme-toggle:after{bottom:-7px}
.theme-toggle:hover{transform:translateY(-2px);box-shadow:0 12px 32px #17102b30}
.theme-toggle .theme-icon{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
@media(max-width:600px){.theme-toggle{left:14px!important;bottom:14px!important;min-width:102px;padding:11px 13px!important}}
</style></head><body><main class="shell"><div class="top"><a class="brand" href="/">♥ whishlist.io</a><div><button id="theme" class="ghost theme-toggle"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span></button><a class="button ghost" href="/login">Login</a><button id="share">Share</button></div></div><section id="app">Loading…</section></main><script src="/list.js"></script></body></html>
