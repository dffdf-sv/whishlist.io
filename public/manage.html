<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit wishlist</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%99%A5%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><style id="corner-theme-toggle">
.theme-toggle{position:fixed!important;left:24px!important;bottom:24px!important;top:auto!important;right:auto!important;z-index:9999;display:inline-flex;align-items:center;justify-content:center;gap:0;min-width:0!important;width:48px;height:48px;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;color:var(--text)!important;backdrop-filter:none!important;transition:transform .2s,color .2s}

.theme-toggle .theme-icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:27px;line-height:1;color:var(--text)}

</style></head><body><main class="shell"><div class="top"><a class="brand" href="/">♥ whishlist.io</a><div><button id="theme" class="ghost theme-toggle"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Dark</span></button><a class="button ghost" href="/login">Login</a><a id="view" class="button ghost">View list</a></div></div><section id="app">Loading…</section></main><script src="/manage.js"></script></body></html>
